nodejs:
    candy:
        description: |
            A Node.js runtime with the npm and pnpm package managers on the default PATH.
            Installs the distro nodejs package (NodeSource node 22.x on Ubuntu and
            Debian so the in-box CLIs that require node >=22 work — the deepseek-harness
            dsh floor), the matching npm CLI, and a self-contained pnpm standalone
            binary at /usr/local/bin/pnpm. Every artifact is a real file at a known
            path with a working --version, so the runtime is directly verifiable.
        env:
            NPM_CONFIG_PREFIX: "~/.npm-global"
            npm_config_cache: "~/.cache/npm"
        path_append:
            - "~/.npm-global/bin"
        package:
            - nodejs
        distro:
            arch:
                package:
                    - npm
            debian:
                # Debian 13 (trixie) distro nodejs is 20 — too old for the dsh
                # harness floor (node >=22.19.0). Install nodejs from NodeSource
                # (node 22.x) exactly as Ubuntu does: apt prefers its higher
                # version over trixie's 20. The apt `npm` package is DROPPED —
                # NodeSource's nodejs BUNDLES npm at /usr/bin/npm, and installing
                # the separate apt `npm` alongside pulls conflicting node-* deps
                # (the same rationale as the Ubuntu section below).
                repo:
                    - name: nodesource
                      url: "https://deb.nodesource.com/node_22.x"
                      key: "https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key"
                      suite: nodistro
                      components: main
            fedora:
                package:
                    - npm
            ubuntu:
                # Ubuntu 24.04 (noble) apt freezes nodejs at 18.19.1 — too old for the
                # box's own npm CLIs (firebase requires node >=20; gemini-cli's undici
                # needs the node>=20 global `File`; oracle's string-width needs the
                # node>=20 unicode-sets `v` regex flag) AND for the deepseek-harness
                # dsh floor (node >=22.19.0). Install nodejs from NodeSource (node
                # 22.x): apt prefers its higher version over noble's 18. The base
                # `package: [nodejs]` (top-level) supplies the package name; this section
                # only adds the repo. The apt `npm` package is INTENTIONALLY omitted —
                # NodeSource's nodejs BUNDLES npm at /usr/bin/npm, and installing the
                # separate apt `npm` alongside it pulls conflicting node-* deps (broken
                # packages). fedora/arch keep their dnf/pacman npm (their base node is
                # already >=22). This is the deliberate "NodeSource upgrade that
                # DROPS the separate npm" the prior note described — now required because
                # the in-box CLIs outgrew noble's frozen node 18 and dsh needs node 22.
                repo:
                    - name: nodesource
                      url: "https://deb.nodesource.com/node_22.x"
                      key: "https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key"
                      suite: nodistro
                      components: main
        var:
            PNPM_VERSION: "10.33.4"
            # The allowBuilds KEY FORM a consumer's pnpm-workspace.yaml must use for a
            # GIT-SPECIFIER dependency is VERSION-COUPLED, and the coupling is invisible:
            # the two forms fail on each other's pin, so there is no form that works at
            # both. MEASURED in the real build image (Fedora 43, node 22.22.2) against
            # pod-dsh's dsh-web profile — opencharly/layer-nodejs#5:
            #
            #   allowBuilds key form                          pnpm 10.33.4   pnpm 10.34.6
            #   bare name   "@perrylink/dsh-github": true    PASS          ERR_PNPM_GIT_DEP_PREPARE_NOT_ALLOWED
            #   URL key     "@perrylink/dsh-github@https://codeload.github.com/...": true
            #                                                ERR_PNPM_INVALID_VERSION_UNION  PASS
            #
            # So a pin bump across that band MUST re-measure the form and move BOTH
            # constants below in the SAME change; the `check:` step beneath makes
            # forgetting it RED instead of a hard-failed consumer profile install. The
            # band boundary is deliberately NOT extrapolated from the two probed
            # endpoints (only those two were measured) — a new pin must re-measure and
            # record, which is the whole point. Consumer status: pod-dsh vendored its
            # git-hosted plugins as prebuilt `file:` tarballs (pod-dsh#28, merged
            # 2026-10-07), so no git dep remains THERE today — the rule still binds any
            # consumer that pins one.
            PNPM_ALLOWBUILDS_GIT_KEY_FORM: bare
            PNPM_ALLOWBUILDS_PROBED_BARE: "10.33.4"
            PNPM_ALLOWBUILDS_PROBED_URL: "10.34.6"
        plan:
            - run: |
                command=case "${BUILD_ARCH}" in
                  x86_64)  PNPM_ARCH="x64" ;;
                  aarch64) PNPM_ARCH="arm64" ;;
                  *) echo "Unsupported arch: ${BUILD_ARCH}"; exit 1 ;;
                esac
                curl -fsSL "https://github.com/pnpm/pnpm/releases/download/v${PNPM_VERSION}/pnpm-linux-${PNPM_ARCH}" -o /usr/local/bin/pnpm
                chmod 0755 /usr/local/bin/pnpm
              run_as: root
              command: |
                case "${BUILD_ARCH}" in
                  x86_64)  PNPM_ARCH="x64" ;;
                  aarch64) PNPM_ARCH="arm64" ;;
                  *) echo "Unsupported arch: ${BUILD_ARCH}"; exit 1 ;;
                esac
                curl -fsSL "https://github.com/pnpm/pnpm/releases/download/v${PNPM_VERSION}/pnpm-linux-${PNPM_ARCH}" -o /usr/local/bin/pnpm
                chmod 0755 /usr/local/bin/pnpm
            - check: the node interpreter is installed at /usr/bin/node
              file:
                file: /usr/bin/node
                exists: true
            - check: node reports its version and exits cleanly
              exit_status: 0
              command: /usr/bin/node --version
            - # The dsh harness floor (node ^22.19.0 || >=24.0.0). No `${...}` anywhere:
              # a check step's command goes through charly's variable substitution, which
              # reads `${HOME:-default}` as a variable named `HOME:-default`, fails to
              # resolve it, and SKIPS the step — trading a red check for a silently absent
              # one. `node -e` with single quotes has no `${...}`, so it always runs.
              check: node is at least 22.19.0 (the deepseek-harness dsh floor)
              exit_status: 0
              command: |
                node -e 'const [maj,min]=process.versions.node.split(".").map(Number); if (maj<22||(maj===22&&min<19)) process.exit(1)'
            - check: the npm package manager is installed at /usr/bin/npm
              file:
                file: /usr/bin/npm
                exists: true
            - check: npm reports its version and exits cleanly
              exit_status: 0
              command: /usr/bin/npm --version
            - check: the self-contained pnpm binary lands on the system PATH at /usr/local/bin/pnpm
              file:
                file: /usr/local/bin/pnpm
                exists: true
            - # pnpm hard-requires a homedir and dies with "Could not find the homedir" when $HOME
              # is unset — unlike node and npm, which do not care. A live-container exec provides
              # no HOME, so this check passed at image build and failed under `charly check live`
              # on every box composing this candy. Derive it from passwd when unset, which is the
              # same getent-based discovery the layer skill prescribes for `command:` steps
              # (RUN shells do not export $USER or $HOME reliably either).
              check: pnpm runs and reports its version
              exit_status: 0
              # No `${...}` anywhere: a check step's command goes through charly's variable
              # substitution, which reads `${HOME:-default}` as a variable named
              # `HOME:-default`, fails to resolve it, and SKIPS the step — trading a red check
              # for a silently absent one. `$( )` is not substituted, so derive the homedir
              # with it and hand the result to env(1).
              command: |
                env HOME="$(getent passwd "$(id -u)" | cut -d: -f6)" pnpm --version
            - check: package=nodejs
              id: nodejs-package
              package:
                package: nodejs
                installed: true
            - # The pin <-> allowBuilds-key-form coupling, ASSERTED rather than remembered
              # (opencharly/layer-nodejs#5). A pin bump across the measured band silently
              # hard-fails a consumer's profile install at image build time; this step makes
              # that a RED check on the bump instead. It asserts only what was MEASURED (the
              # two probed versions), never an extrapolated boundary: any other pin fails
              # loudly and asks the author to re-measure and record the form here.
              #
              # ZERO `${...}` and ZERO `$` ANYWHERE in this command, deliberately: a check
              # step's command goes through charly's variable substitution, which reads
              # `${X}` as a charly variable and SKIPS the whole step when it cannot resolve
              # one — trading a red check for a silently absent one, which is exactly the
              # silent-no-op class this assertion exists to prevent. `var:` values are
              # exported as ENV before this step, so the script reads them with
              # `process.env[...]` and the messages are built by CONCATENATION, never by a
              # template literal. The grep that proves it: `grep -c '\$'` over this command
              # returns 0, so substitution has no token to act on and the step cannot be
              # skipped.
              check: the pinned pnpm version's allowBuilds git-key form matches the recorded measurement
              exit_status: 0
              command: |
                node -e '
                  const keys = ["PNPM_VERSION", "PNPM_ALLOWBUILDS_GIT_KEY_FORM", "PNPM_ALLOWBUILDS_PROBED_BARE", "PNPM_ALLOWBUILDS_PROBED_URL"];
                  const values = keys.map((k) => process.env[k] || "");
                  const missing = keys.filter((k) => !process.env[k]);
                  if (missing.length > 0) { console.error("these pnpm pin band vars are not exported: " + missing.join(", ")); process.exit(1); }
                  const measured = new Map([[values[2], "bare"], [values[3], "url"]]);
                  const want = measured.get(values[0]);
                  if (want === undefined) {
                    console.error("pnpm " + values[0] + " is UNMEASURED for the allowBuilds git-key form. Bump only with a measurement: run a consumer profile that installs a git-specifier dep with a build script and record which form passes, then move PNPM_ALLOWBUILDS_GIT_KEY_FORM and the PROBED_* pair together (opencharly/layer-nodejs#5).");
                    process.exit(1);
                  }
                  if (values[1] !== want) {
                    console.error("pnpm " + values[0] + " requires the allowBuilds git-key form \"" + want + "\", but PNPM_ALLOWBUILDS_GIT_KEY_FORM is \"" + values[1] + "\" (opencharly/layer-nodejs#5)");
                    process.exit(1);
                  }
                  console.log("pnpm " + values[0] + ": allowBuilds git-key form \"" + values[1] + "\" matches the recorded measurement");
                '

nodejs-skill:
    skill:
        name: nodejs
        family: coder
        owner: nodejs
        description: |-
            Node.js and npm via system packages (RPM/DEB) with global npm prefix.
            Use when working with Node.js, npm, or JavaScript/TypeScript tooling.
        content: |-
            # nodejs -- Node.js and npm runtime
            
            ## Candy Properties
            
            | Property | Value |
            |----------|-------|
            | Install files | `charly.yml`, `task:` |
            
            ## Environment Variables
            
            | Variable | Value |
            |----------|-------|
            | `NPM_CONFIG_PREFIX` | `~/.npm-global` |
            | `npm_config_cache` | `~/.cache/npm` |
            
            PATH additions: `~/.npm-global/bin`
            
            ## Packages

            RPM: `nodejs`, `npm`
            DEB: `nodejs` (NodeSource node 22.x on Ubuntu + Debian; npm is bundled
            by NodeSource, not the separate apt `npm` package)
            PAC: `nodejs`, `npm`
            
            ## pnpm (standalone binary)
            
            The candy installs the **pnpm** standalone binary (self-contained — it bundles
            its own node) to `/usr/local/bin/pnpm` via a `task:` download. It is deliberately
            NOT a `package.json` dependency: a `package.json` would trigger the npm
            multi-stage builder on this candy, and the builder images that COMPOSE nodejs
            (`arch-builder` / `fedora-builder`) cannot self-provide the npm builder. The
            binary on `/usr/local/bin` is on the default system PATH for every user (incl.
            root — Immich runs its pnpm build as root). Immich and other pnpm consumers use
            this pnpm to drive their build.

            ### The pin and a consumer's `allowBuilds` KEY FORM are a COUPLED PAIR

            pnpm >= 10 blocks a dependency's build/install scripts unless it is allowlisted,
            and for a **git-specifier** dependency the KEY FORM of that allowlist entry is
            version-coupled: the two forms fail on each other's pin, so no single form works
            at both. MEASURED in the real build image (Fedora 43, node 22.22.2) against
            pod-dsh's `dsh-web` profile — `opencharly/layer-nodejs#5`:

            | `allowBuilds` key form | pnpm `10.33.4` | pnpm `10.34.6` |
            |---|---|---|
            | bare name — `"@perrylink/dsh-github": true` | PASS | `ERR_PNPM_GIT_DEP_PREPARE_NOT_ALLOWED` |
            | fully-qualified URL key — `"@perrylink/dsh-github@https://codeload.github.com/<owner>/<repo>/.git": true` | `ERR_PNPM_INVALID_VERSION_UNION` | PASS |

            A wrong pair hard-fails the consumer's profile install at IMAGE BUILD time. So
            `PNPM_VERSION`, `PNPM_ALLOWBUILDS_GIT_KEY_FORM` and the two PROBED_* constants move
            together, and the candy's own
            `check: the pinned pnpm version's allowBuilds git-key form matches the recorded measurement`
            makes a bump that forgets them RED instead of a hard-failed consumer build. Only the
            two probed versions are accepted: a bump to any other pin must RE-MEASURE the form and
            record it. (pod-dsh vendored its git-hosted plugins as prebuilt `file:` tarballs in
            pod-dsh#28, so no git dep remains there today — the rule still binds any consumer
            that pins one.)
            
            ## Usage
            
            ```yaml
            # charly.yml
            my-image:
              candy:
                - nodejs
            ```
            
            ## Used In Boxes
            
            - `/charly-distros:fedora-builder`
            - `/charly-distros:arch-builder`
            - Transitive dependency for `openclaw`, `pre-commit`, and other candies
            
            ## Related Candies
            
            - `/charly-coder:pre-commit` -- depends on nodejs
            - `/charly-immich:immich-layer` -- uses the candy's pnpm to build Immich
            
            ## When to Use This Skill
            
            Use when the user asks about:
            
            - Node.js or npm setup in containers
            - Global npm package installation
            - The `nodejs` candy or npm configuration
            
            ## Related
            
            - `/charly-image:layer` — candy authoring reference (`charly.yml` schema, task verbs, service declarations)
            - `/charly-check:check` — declarative testing (`check:` block, `charly check box`, `charly check live`)
